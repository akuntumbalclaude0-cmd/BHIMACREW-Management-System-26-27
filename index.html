<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHIMACREW · OSIS & MPK SMAN 1 Madiun</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{--mer:#F5EEDD;--rock:#84B3CE;--ven:#16587B;--ink:#12313f;--mut:#5f7482;--card:#FFFBF2;--line:#E3D9BF;--ok:#2f7d4f;--bad:#c0392b;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--mer);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.ser{font-family:Georgia,"Times New Roman",serif}
.app{display:flex;min-height:100vh}
aside{width:262px;background:var(--ven);color:var(--mer);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;padding:16px 12px}
aside .brand{display:flex;gap:8px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(245,238,221,.2);margin-bottom:10px}
aside .brand img{width:38px;height:38px;object-fit:contain;background:var(--mer);border-radius:50%;padding:2px}
aside .brand b{display:block;font:700 15px Georgia,serif;letter-spacing:.5px}aside .brand small{opacity:.75;font-size:11px}
aside a{display:flex;gap:8px;align-items:center;color:var(--mer);text-decoration:none;padding:8px 10px;border-radius:10px;font-size:14px;opacity:.9}
aside a:hover{background:rgba(132,179,206,.25)}aside a.on{background:var(--rock);color:var(--ven);font-weight:700;opacity:1}
aside .gl{font-size:11px;letter-spacing:1.5px;opacity:.6;margin:14px 8px 4px}
aside a i{width:20px;height:20px;border-radius:6px;font:700 11px system-ui;display:grid;place-items:center;color:#fff;font-style:normal;flex-shrink:0}
.mode{margin:14px 6px 0;font-size:12px}.mode button{width:100%;margin-top:6px}
main{flex:1;min-width:0;padding:22px;max-width:1150px}
.top{display:none}
.hero{position:relative;overflow:hidden;border-radius:20px;margin-bottom:18px;min-height:300px;color:var(--mer);background:var(--ven)}
.hero .sls,.hero .ov2{position:absolute;inset:0}.hero .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s}.hero .sl.on{opacity:1}
.hero .ov2{background:radial-gradient(circle at 1px 1px,rgba(245,238,221,.12) 1.5px,transparent 2px) 0 0/18px 18px,linear-gradient(100deg,rgba(12,58,82,.86) 0%,rgba(22,88,123,.55) 42%,rgba(22,88,123,.16) 100%)}
.hero .tx{position:relative;padding:26px;z-index:2}.hero h1{margin:0 0 4px;font-size:28px;max-width:70%}.hero p{margin:0;opacity:.9;max-width:70%}
.hero .hlogo{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:3}.hero .hlogo img{height:58px;width:58px;object-fit:contain;background:var(--mer);border-radius:50%;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
@media(max-width:860px){.hero h1,.hero p{max-width:100%}.hero .hlogo{position:relative;top:auto;right:auto;padding:14px 14px 0;z-index:3}.hero .hlogo img{height:44px;width:44px}}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.chip{background:rgba(245,238,221,.15);border:1px solid rgba(245,238,221,.25);border-radius:14px;padding:8px 14px}.chip b{font:700 22px Georgia,serif;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:20px;color:var(--ven)}h3{margin:0 0 6px;font-size:16px}.mut{color:var(--mut)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.bub{cursor:pointer;border-radius:22px;padding:16px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;transition:.15s;text-decoration:none;color:inherit;display:block}
.bub:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(22,88,123,.15);border-color:var(--rock)}
.bub .n{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 18px Georgia,serif;margin-bottom:8px}
.bub small{display:block;color:var(--mut);font-size:12px}.bub b{display:block;font-size:14px;line-height:1.3;margin:2px 0 8px}
.bar{height:8px;background:#e9e0c8;border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rock),var(--ven))}
.bd{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;display:inline-block}
.belum{background:#e8e2d0;color:#5b5a4a}.progres{background:#fde8b8;color:#8a5a00}.done{background:#cfeadb;color:#1e6b42}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--rock)}select.st{width:auto;font-weight:600;font-size:12px;border-radius:99px;padding:4px 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.b1{background:var(--ven);color:var(--mer)}.b2{background:#dfeaf0;color:var(--ven)}.x{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.r4{grid-template-columns:2fr 1fr 1fr 1fr 32px}.r3{grid-template-columns:2fr 1fr 1fr 32px}.r2{grid-template-columns:1fr 1fr 32px}
.th{font-size:12px;color:var(--mut);font-weight:600}
.big{font:700 24px Georgia,serif}.bk{background:none;color:var(--ven);padding:0;margin-bottom:10px}
.dv{border:1px solid var(--line);border-left:5px solid var(--rock);border-radius:12px;padding:10px;margin:10px 0;background:#fff}
.td{display:grid;grid-template-columns:2fr 1fr 1fr 32px;gap:8px;align-items:center;padding:4px 0 4px 12px}
.jb{border:2px solid var(--ven);border-radius:12px;overflow:hidden;background:#fff}.jb .t{background:var(--ven);color:var(--mer);padding:8px 10px;display:flex;gap:8px;align-items:center}
.jb .t input{background:rgba(245,238,221,.18);color:var(--mer);border:0;font-weight:700}.jb .b{padding:8px 10px}
.it{display:grid;grid-template-columns:24px 1fr 28px;gap:4px;align-items:center;margin:4px 0}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;margin:2px 3px 0 0}
.chipb{border:1px solid var(--line);background:#fff;color:var(--mut);padding:4px 10px;font-size:12px;border-radius:99px}.chipb.on{background:var(--ven);color:var(--mer);border-color:var(--ven)}
.ov{color:var(--bad);font-weight:600}a{color:var(--ven)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.day{min-height:62px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;font-size:12px}
.day.o{opacity:.35}.day.t{outline:2px solid var(--ven)}.day.s{background:#dfeaf0}.day.dl{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}.dots i{width:8px;height:8px;border-radius:50%}.dots i.d{border-radius:2px;background:var(--bad)!important}
.board{background:#EFE6CE;border:1px solid #d9cca9;background-image:radial-gradient(circle at 1px 1px,rgba(22,88,123,.1) 1px,transparent 1.5px);background-size:16px 16px;overflow:hidden}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px 22px;padding:14px 8px 10px}
.pol{position:relative;background:#fff;padding:9px 9px 34px;box-shadow:0 6px 16px rgba(18,49,63,.25);transform:rotate(var(--r));transition:.2s}.pol:hover{transform:rotate(0) scale(1.04);z-index:5}
.pol img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}.pol span{position:absolute;left:10px;right:10px;bottom:8px;font:italic 700 14px Georgia,serif;color:var(--ven);text-align:center}
.pol .tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;background:rgba(132,179,206,.7);transform:rotate(-3deg)}
.pol .pin{position:absolute;top:-6px;right:14px;width:14px;height:14px;border-radius:50%;background:#c0392b;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.post{grid-column:span 2;background:#FBF7EC;border:1px solid #d9cca9;padding:16px 18px 16px 130px;position:relative;box-shadow:0 5px 14px rgba(18,49,63,.2);transform:rotate(1.2deg);min-height:150px}
.post small{letter-spacing:4px;color:var(--mut);font-weight:700;display:block}.post b{display:block;font-size:26px;color:var(--ven)}.post span{display:block;font-size:13px;margin:4px 0}.post em{display:block;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.stamp{position:absolute;left:16px;top:16px;width:92px;height:106px;border:2px dashed var(--rock);display:grid;place-items:center;background:#fff;transform:rotate(-3deg)}.stamp img{width:70px;height:70px;object-fit:contain}
.stk{align-self:center;justify-self:center;font:800 18px Georgia,serif;padding:10px 20px;border-radius:99px;transform:rotate(-6deg)}
.stk.a{background:#E87E3E;color:#fff;border-radius:50% 40% 50% 40%}.stk.b{background:#F4C430;color:#16587B;border:3px solid #16587B}.stk.c{background:#fff;color:#12313f;border-radius:14px;transform:rotate(4deg);box-shadow:0 3px 8px rgba(0,0,0,.2)}
@media(max-width:620px){.post{grid-column:span 1;padding:16px;padding-top:130px}}
.pht{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.pht img{display:block;width:100%;aspect-ratio:16/7;object-fit:cover}.pht .in{padding:8px;display:grid;gap:6px}
.ft{text-align:center;color:var(--mut);font-size:12px;padding:20px}
#sb{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:12px 18px;background:var(--ven);color:var(--mer)}
@media(max-width:860px){aside{position:fixed;z-index:40;left:-280px;transition:.2s;width:270px}body.nav aside{left:0}
.top{display:flex;align-items:center;gap:10px;background:var(--ven);color:var(--mer);padding:10px 14px;position:sticky;top:0;z-index:20}.top button{background:var(--rock);color:var(--ven);padding:6px 12px}
main{padding:14px}.r4,.r3,.r2{grid-template-columns:1fr 1fr}.th{display:none}.td{grid-template-columns:1fr 1fr}.hero .wm2{display:none}}
</style></head><body>
